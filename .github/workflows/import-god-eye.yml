name: Validar God Eye W3 Brasil
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-god-eye.yml'
      - 'src/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: import-god-eye-full
  cancel-in-progress: false
jobs:
  verify-w3-br:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar CEP, rua, português, câmera e veículos
        run: npm run test:br
      - name: Compilar interface W3 para Vercel
        run: npm run build
      - name: Verificar publicação
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -d dist/cesium
