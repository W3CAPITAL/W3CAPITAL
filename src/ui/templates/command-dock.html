  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="Navegação, voz e efeitos visuais">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="Abrir efeitos visuais">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>EFEITOS VISUAIS</span>
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="Fixar efeitos visuais" aria-pressed="false" title="Manter efeitos abertos"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="Mostrar o globo sem filtro visual.">
          <span class="btn-icon">◯</span>
          <span class="btn-label">Normal</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="Simular um monitor CRT com fósforo verde.">
          <span class="btn-icon">▦</span>
          <span class="btn-label">CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="Simular visão noturna.">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">NVG</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="Simular visão térmica.">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label">FLIR</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="Aplicar contornos ilustrados.">
          <span class="btn-icon">✦</span>
          <span class="btn-label">Anime</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="Aplicar alto contraste em preto e branco.">
          <span class="btn-icon">◐</span>
          <span class="btn-label">Noir</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="Adicionar efeito de neve.">
          <span class="btn-icon">❄</span>
          <span class="btn-label">Snow</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">FONTE DO MAPA</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">MAPA</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="Fonte do mapa"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label" >Estilo</span>
        <span id="style-mini-value" class="panel-mini-value">NORMAL</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Abrir localização" title="Expand LOCATION">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>LOCALIZAÇÃO</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="Collapse panel">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city">📍 Localização: --</div>
        <div id="location-mini-poi" class="location-mini-poi">Ponto de interesse: --</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="Fixar painel de localização" aria-pressed="false" title="Manter painel aberto"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="Pesquisar localização">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="Procurar rua, bairro, cidade ou CEP..." autocomplete="off" spellcheck="false" aria-label="Procurar endereço, coordenadas ou CEP" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
